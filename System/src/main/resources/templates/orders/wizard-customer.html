<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: page-head('New Order - Step 1: Customer')}"></th:block>
    <script th:src="@{/js/new-order.js}" defer></script>
</head>
<body>

    <header th:replace="~{fragments/layout :: top-bar}"></header>

    <main class="page-content">
        <div th:replace="~{fragments/layout :: flash-messages}"></div>

        <nav th:replace="~{fragments/layout :: wizard-progress(1)}"></nav>

        <section class="dashboard-table-section">
            <div class="card" style="max-width: 600px;">
                <h1 class="page-title" style="font-size: 22px; margin-bottom: 6px;">Step 1: Customer Details</h1>
                <p class="section-subtext" style="margin-bottom: 24px;">Enter the customer's 10-digit mobile number for instant profile lookup.</p>

                <form th:action="@{/orders/new/customer}" th:object="${customerStepForm}" method="post">
                    <input type="hidden" id="customerId" th:field="*{customerId}">
                    <input type="hidden" th:field="*{existingOrderId}">

                    <div class="form-group">
                        <label for="customerMobile" class="form-label">Mobile Number (10 digits):</label>
                        <span id="lookupBadge" style="display: none;"></span>
                        <input type="tel"
                               id="customerMobile"
                               th:field="*{mobile}"
                               placeholder="e.g. 9876543210"
                               maxlength="10"
                               required
                               autofocus>
                        <span th:if="${#fields.hasErrors('mobile')}" th:errors="*{mobile}" class="form-error"></span>
                    </div>

                    <!-- Dynamic customer history snippet populated by new-order.js -->
                    <div id="customerHistoryInfo" style="display: none; margin-bottom: 16px;"></div>

                    <div class="form-group">
                        <label for="customerName" class="form-label">Customer Full Name:</label>
                        <input type="text"
                               id="customerName"
                               th:field="*{name}"
                               placeholder="e.g. Ramesh Patel"
                               required>
                        <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="form-error"></span>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Continue to Garment &rarr;</button>
                        <a th:href="@{/}" class="btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </section>
    </main>

</body>
</html>
