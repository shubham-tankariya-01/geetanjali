<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: page-head('New Order - Step 2: Choose Garment')}"></th:block>
    <script th:src="@{/js/new-order.js}" defer></script>
</head>
<body>

    <header th:replace="~{fragments/layout :: top-bar}"></header>

    <main class="page-content">
        <div th:replace="~{fragments/layout :: flash-messages}"></div>

        <nav th:replace="~{fragments/layout :: wizard-progress(2)}"></nav>

        <section class="dashboard-table-section">
            <div class="card" style="max-width: 600px;">
                <div class="context-banner" style="margin-bottom: 20px;">
                    <div class="context-meta-text">
                        <span class="text-secondary">Selected Customer: </span>
                        <strong style="color: var(--color-text-primary);" th:text="${draft.customerName}">Ramesh Patel</strong>
                        (<span th:text="${draft.customerMobile}">9876543210</span>)
                    </div>
                    <a th:href="@{/orders/new}" class="link-subtle" style="font-size: 13px;">Change Customer</a>
                </div>

                <h1 class="page-title" style="font-size: 22px; margin-bottom: 6px;">Step 2: Choose Garment Category</h1>
                <p class="section-subtext" style="margin-bottom: 20px;">Select the garment type to stitch for this item.</p>

                <form th:action="@{/orders/new/garment}" method="post">
                    <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px;">
                        <label th:each="g : ${garments}"
                               style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); cursor: pointer; transition: background 0.15s, border-color 0.15s; margin: 0;">
                            <input type="radio"
                                   name="garmentId"
                                   th:value="${g.id}"
                                   th:checked="${draft.currentGarment != null && draft.currentGarment.id == g.id}"
                                   required
                                   style="width: 18px; height: 18px; accent-color: var(--color-primary); cursor: pointer;">
                            <strong style="font-size: 15px; color: var(--color-text-primary);" th:text="${g.name}">Shirt</strong>
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Continue to Measurements &rarr;</button>
                        <a th:href="@{/orders/new}" class="btn-secondary">&larr; Back to Customer</a>
                    </div>
                </form>
            </div>
        </section>
    </main>

</body>
</html>
