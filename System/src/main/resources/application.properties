spring.application.name=Geetanjali

# ------------------------------------------------------------------------------
# Database Configuration
# In Express/Node, this is like reading process.env.DB_URL.
# In Spring, ${VAR_NAME:fallback} reads the environment variable and uses fallback if empty.
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/geetanjali}
spring.datasource.username=${DB_USER:shubham}
spring.datasource.password=${DB_PASSWORD:shubham}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration
# 'validate' verifies that our Java @Entity models strictly match the database schema.
# If a table or column is missing or mismatched, Spring Boot immediately fails with a clear message.
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------------------------
# Flyway Database Migration
# Automatically applies versioned SQL scripts in src/main/resources/db/migration/ on startup.
# ------------------------------------------------------------------------------
spring.flyway.enabled=true

# ------------------------------------------------------------------------------
# File Upload Configuration
# Restricts maximum size of uploaded garment photos to 5MB.
# ------------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ------------------------------------------------------------------------------
# Custom Application Settings
# Servers run in UTC by default, but this tailor shop operates in India (IST).
# ------------------------------------------------------------------------------
app.timezone=Asia/Kolkata
app.upload-dir=uploads

# ------------------------------------------------------------------------------
# Floating AI Assistant Configuration
# Dual Provider Strategy: Groq (Primary, max 900 tokens) -> Gemini (Fallback)
# ------------------------------------------------------------------------------
app.assistant.groq.api-key=${GROQ_API_KEY:}
app.assistant.groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
app.assistant.groq.max-tokens=900
app.assistant.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}

app.assistant.gemini.api-key=${GEMINI_API_KEY:}
app.assistant.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
app.assistant.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

app.assistant.rolling-window-size=10

