<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--
  error/403.html: Access Denied 403 (Pure HTML Baseline).
  Zero CSS classes, pure semantic HTML tags.
-->
<head th:replace="~{fragments/layout :: page-head('Access Denied (403)')}"></head>
<body>

    <header th:replace="~{fragments/layout :: top-bar}"></header>

    <main class="page-content">
        <div th:replace="~{fragments/layout :: flash-messages}"></div>

        <section class="dashboard-hero-section" style="max-width: 600px; margin-top: 40px;">
            <h1 class="page-title">Access Denied (403)</h1>
            <p class="section-subtext text-danger" style="margin-bottom: 20px;" th:text="${errorMessage != null ? errorMessage : 'You do not have permission to view or perform this action. Only the shop owner has administrative access.'}">
                You do not have permission to view or perform this action. Only the shop owner has administrative access.
            </p>
            <a th:href="@{/}" class="btn-primary">&larr; Return to Dashboard</a>
        </section>
    </main>

</body>
</html>
