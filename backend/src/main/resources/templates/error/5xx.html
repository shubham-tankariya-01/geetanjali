<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--
  error/5xx.html: Displayed when an unhandled server error occurs (HTTP 500 Internal Server Error).
  Material You MD3 redesign, zero emojis, no bottom bar.
-->
<head th:replace="~{fragments/layout :: page-head('Server Error (500)')}"></head>
<body>

    <!-- Responsive Glassmorphic Top App Bar -->
    <header th:replace="~{fragments/layout :: top-bar}"></header>

    <div class="container" style="max-width: 680px;">
        <!-- Flash messages area -->
        <div th:replace="~{fragments/layout :: flash-messages}"></div>

        <div class="card" style="box-shadow: var(--shadow-2); border-left: 4px solid var(--md-error);">
            <div style="display: flex; align-items: center; gap: 0.85rem; margin-bottom: 1rem;">
                <div style="width: 48px; height: 48px; border-radius: 50%; background: var(--md-error-container); color: var(--md-on-error-container); display: flex; align-items: center; justify-content: center;">
                    <span class="material-symbols-rounded icon-lg">error</span>
                </div>
                <div>
                    <h2 style="font-size: 1.45rem; font-weight: 600; margin: 0; color: var(--md-on-surface);">Server Error (500)</h2>
                    <span style="font-size: 0.8rem; color: var(--md-on-surface-variant); text-transform: uppercase; font-weight: 600; letter-spacing: 0.04em;">Internal Exception</span>
                </div>
            </div>

            <p style="color: var(--md-on-surface-variant); font-size: 0.95rem; line-height: 1.6;"
               th:text="${errorMessage != null ? errorMessage : 'An unexpected error occurred while processing your request. Please try again or return to the main dashboard.'}">
                An unexpected error occurred while processing your request. Please try again or return to the main dashboard.
            </p>

            <div style="margin-top: 1.5rem; display: flex; gap: 0.75rem;">
                <a th:href="@{/}" class="btn btn-primary">
                    <span class="material-symbols-rounded icon-sm">arrow_back</span>
                    <span>Return to Dashboard</span>
                </a>
            </div>
        </div>
    </div>

</body>
</html>
