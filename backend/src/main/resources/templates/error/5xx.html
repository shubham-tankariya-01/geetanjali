<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: page-head('Server Error (500)')}"></head>
<body>

    <header th:replace="~{fragments/layout :: top-bar}"></header>

    <main class="page-content">
        <div th:replace="~{fragments/layout :: flash-messages}"></div>

        <section class="dashboard-hero-section" style="max-width: 600px; margin-top: 40px;">
            <h1 class="page-title">Server Error (500)</h1>
            <p class="section-subtext text-danger" style="margin-bottom: 20px;" th:text="${errorMessage != null ? errorMessage : 'An unexpected error occurred while processing your request. Please try again or return to the main dashboard.'}">
                An unexpected error occurred while processing your request. Please try again or return to the main dashboard.
            </p>
            <a th:href="@{/}" class="btn-primary">&larr; Return to Dashboard</a>
        </section>
    </main>

</body>
</html>
