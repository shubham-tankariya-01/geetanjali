<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--
  error/404.html: Page Not Found 404 (Pure HTML Baseline).
  Zero CSS classes, pure semantic HTML tags.
-->
<head th:replace="~{fragments/layout :: page-head('Page Not Found (404)')}"></head>
<body>

    <header th:replace="~{fragments/layout :: top-bar}"></header>

    <main class="page-content">
        <div th:replace="~{fragments/layout :: flash-messages}"></div>

        <section class="dashboard-hero-section" style="max-width: 600px; margin-top: 40px;">
            <h1 class="page-title">Page Not Found (404)</h1>
            <p class="section-subtext" style="margin-bottom: 20px;" th:text="${errorMessage != null ? errorMessage : 'The page, order, or customer record you requested does not exist.'}">
                The page, order, or customer record you requested does not exist.
            </p>
            <a th:href="@{/}" class="btn-primary">&larr; Return to Dashboard</a>
        </section>
    </main>

</body>
</html>
