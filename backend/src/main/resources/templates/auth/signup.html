<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: page-head('Sign Up')}"></head>
<body>

    <main class="auth-card">
        <header style="text-align: center; margin-bottom: 24px;">
            <div style="display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px;">
                <svg class="brand-logo-svg" width="48" height="48" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="signupLogoBg" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#222630"/>
                            <stop offset="100%" stop-color="#13151A"/>
                        </linearGradient>
                        <linearGradient id="signupLogoGold" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#D8BE8A"/>
                            <stop offset="100%" stop-color="#B89656"/>
                        </linearGradient>
                        <linearGradient id="signupLogoSteel" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#F8FAFC"/>
                            <stop offset="100%" stop-color="#CBD5E1"/>
                        </linearGradient>
                    </defs>
                    <rect width="36" height="36" rx="9" fill="url(#signupLogoBg)"/>
                    <rect x="1" y="1" width="34" height="34" rx="8" stroke="#2D3442" stroke-width="1"/>
                    <circle cx="11.5" cy="12.5" r="3.3" stroke="url(#signupLogoGold)" stroke-width="2" fill="none"/>
                    <circle cx="11.5" cy="23.5" r="3.3" stroke="url(#signupLogoGold)" stroke-width="2" fill="none"/>
                    <path d="M14.5 14L25.5 24M14.5 22L25.5 12" stroke="url(#signupLogoSteel)" stroke-width="2.2" stroke-linecap="round"/>
                    <circle cx="18" cy="18" r="1.8" fill="url(#signupLogoGold)" stroke="#13151A" stroke-width="0.8"/>
                </svg>
            </div>
            <h1 class="page-title" style="font-size: 24px; margin-bottom: 4px;" th:if="${isFirstRun}">Setup Tailor Shop</h1>
            <h1 class="page-title" style="font-size: 24px; margin-bottom: 4px;" th:unless="${isFirstRun}">Add Staff Member</h1>
            <p class="section-subtext" style="font-size: 14px;" th:if="${isFirstRun}">Create your shop profile and primary owner account</p>
            <p class="section-subtext" style="font-size: 14px;" th:unless="${isFirstRun}">Register a new staff member for <strong th:text="${shopName}">Geetanjali</strong></p>
        </header>

        <div th:replace="~{fragments/layout :: flash-messages}"></div>

        <form th:action="@{/signup}" th:object="${signupForm}" method="post">
            <!-- Shop Name (Only visible during first-run setup) -->
            <div class="form-group" th:if="${isFirstRun}">
                <label for="shopName" class="form-label">Shop Name:</label>
                <input type="text"
                       id="shopName"
                       th:field="*{shopName}"
                       placeholder="e.g. Geetanjali Tailors">
                <span th:if="${#fields.hasErrors('shopName')}" th:errors="*{shopName}" class="form-error"></span>
            </div>

            <!-- Full Name -->
            <div class="form-group">
                <label for="fullName" class="form-label">Full Name:</label>
                <input type="text"
                       id="fullName"
                       th:field="*{fullName}"
                       placeholder="e.g. Ramesh Tailor"
                       required>
                <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="form-error"></span>
            </div>

            <!-- Mobile Number -->
            <div class="form-group" style="margin-top: 14px;">
                <label for="mobile" class="form-label">Mobile Number (10 digits):</label>
                <input type="text"
                       id="mobile"
                       th:field="*{mobile}"
                       placeholder="e.g. 9876543210"
                       required>
                <span th:if="${#fields.hasErrors('mobile')}" th:errors="*{mobile}" class="form-error"></span>
            </div>

            <!-- Password -->
            <div class="form-group" style="margin-top: 14px;">
                <label for="password" class="form-label">Password (minimum 4 characters):</label>
                <input type="password"
                       id="password"
                       th:field="*{password}"
                       placeholder="Minimum 4 characters"
                       required>
                <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="form-error"></span>
            </div>

            <!-- Role Selection (Only shown when an Owner is adding staff) -->
            <div class="form-group" style="margin-top: 14px;" th:unless="${isFirstRun}">
                <label for="role" class="form-label">Staff Role:</label>
                <select id="role" th:field="*{role}">
                    <option value="TAILOR">Tailor (Orders &amp; Measurements)</option>
                    <option value="OWNER">Owner (Full Administration)</option>
                </select>
            </div>

            <div style="margin-top: 24px;">
                <button type="submit" class="btn-primary" style="width: 100%; height: 44px; font-size: 15px;">
                    <span th:if="${isFirstRun}">Complete Setup &amp; Create Owner &rarr;</span>
                    <span th:unless="${isFirstRun}">Create Staff Member &rarr;</span>
                </button>
            </div>
        </form>

        <div style="text-align: center; margin-top: 20px;" th:if="${!isFirstRun}">
            <a th:href="@{/more}" class="link-subtle" style="font-size: 13.5px;">&larr; Back to Settings</a>
        </div>
    </main>

</body>
</html>
