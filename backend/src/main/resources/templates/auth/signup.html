<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--
  auth/signup.html: First-run owner setup or staff creation.
-->
<head th:replace="~{fragments/layout :: page-head('Sign Up')}"></head>
<body>

    <div class="auth-wrapper">
        <div class="auth-header">
            <h2 th:if="${isFirstRun}">Setup Tailor Shop</h2>
            <h2 th:unless="${isFirstRun}">Add Staff Member</h2>
            <p th:if="${isFirstRun}">Create your shop and primary owner account</p>
            <p th:unless="${isFirstRun}">Register a new staff member for <span th:text="${shopName}">Geetanjali</span></p>
        </div>

        <!-- Flash messages for notices -->
        <div th:replace="~{fragments/layout :: flash-messages}"></div>

        <div class="card">
            <form th:action="@{/signup}" th:object="${signupForm}" method="post">
                <!-- Shop Name (Only visible during first-run setup) -->
                <div class="form-group" th:if="${isFirstRun}">
                    <label for="shopName">Shop Name</label>
                    <input type="text"
                           id="shopName"
                           th:field="*{shopName}"
                           class="form-control"
                           placeholder="e.g. Geetanjali Tailors">
                    <div class="field-error" th:if="${#fields.hasErrors('shopName')}" th:errors="*{shopName}"></div>
                </div>

                <!-- Full Name -->
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text"
                           id="fullName"
                           th:field="*{fullName}"
                           class="form-control"
                           placeholder="e.g. Ramesh Tailor"
                           required>
                    <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <!-- Mobile Number -->
                <div class="form-group">
                    <label for="mobile">Mobile Number (10 digits)</label>
                    <input type="text"
                           id="mobile"
                           th:field="*{mobile}"
                           class="form-control"
                           placeholder="e.g. 9876543210"
                           required>
                    <div class="field-error" th:if="${#fields.hasErrors('mobile')}" th:errors="*{mobile}"></div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password"
                           id="password"
                           th:field="*{password}"
                           class="form-control"
                           placeholder="Minimum 4 characters"
                           required>
                    <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <!-- Role Selection (Only shown when an Owner is adding staff) -->
                <div class="form-group" th:unless="${isFirstRun}">
                    <label for="role">Staff Role</label>
                    <select id="role" th:field="*{role}" class="form-control">
                        <option value="TAILOR">Tailor (Orders &amp; Measurements)</option>
                        <option value="OWNER">Owner (Full Administration)</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                    <span th:if="${isFirstRun}">Complete Setup &amp; Create Owner</span>
                    <span th:unless="${isFirstRun}">Create Staff Member</span>
                </button>
            </form>

            <div style="margin-top: 1rem; text-align: center;" th:if="${!isFirstRun}">
                <a th:href="@{/}" style="color: var(--text-muted); font-size: 0.85rem; text-decoration: none;">&larr; Back to Dashboard</a>
            </div>
        </div>
    </div>

</body>
</html>
