<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: page-head('Login')}"></head>
<body>

    <main class="auth-card">
        <header style="text-align: center; margin-bottom: 24px;">
            <div style="display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px;">
                <svg class="brand-logo-svg" width="48" height="48" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="loginLogoBg" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#222630"/>
                            <stop offset="100%" stop-color="#13151A"/>
                        </linearGradient>
                        <linearGradient id="loginLogoGold" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#D8BE8A"/>
                            <stop offset="100%" stop-color="#B89656"/>
                        </linearGradient>
                        <linearGradient id="loginLogoSteel" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#F8FAFC"/>
                            <stop offset="100%" stop-color="#CBD5E1"/>
                        </linearGradient>
                    </defs>
                    <rect width="36" height="36" rx="9" fill="url(#loginLogoBg)"/>
                    <rect x="1" y="1" width="34" height="34" rx="8" stroke="#2D3442" stroke-width="1"/>
                    <circle cx="11.5" cy="12.5" r="3.3" stroke="url(#loginLogoGold)" stroke-width="2" fill="none"/>
                    <circle cx="11.5" cy="23.5" r="3.3" stroke="url(#loginLogoGold)" stroke-width="2" fill="none"/>
                    <path d="M14.5 14L25.5 24M14.5 22L25.5 12" stroke="url(#loginLogoSteel)" stroke-width="2.2" stroke-linecap="round"/>
                    <circle cx="18" cy="18" r="1.8" fill="url(#loginLogoGold)" stroke="#13151A" stroke-width="0.8"/>
                </svg>
            </div>
            <h1 class="page-title" style="font-size: 24px; margin-bottom: 4px;" th:text="${shopName}">Geetanjali Tailors</h1>
            <p class="section-subtext" style="font-size: 14px;">Staff &amp; Owner Secure Access</p>
        </header>

        <div th:replace="~{fragments/layout :: flash-messages}"></div>

        <!-- Form submits to POST /login which is intercepted by Spring Security -->
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="mobile" class="form-label">Mobile Number or Username:</label>
                <input type="text"
                       id="mobile"
                       name="mobile"
                       placeholder="e.g. 9876543210 or shubham"
                       required
                       autofocus>
            </div>

            <div class="form-group" style="margin-top: 16px;">
                <label for="password" class="form-label">Password:</label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Enter your password"
                       required>
            </div>

            <div style="margin-top: 24px;">
                <button type="submit" class="btn-primary" style="width: 100%; height: 44px; font-size: 15px;">Log In &rarr;</button>
            </div>
        </form>
    </main>

</body>
</html>
