<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--
  auth/login.html: Staff and Owner login page using mobile number.
-->
<head th:replace="~{fragments/layout :: page-head('Login')}"></head>
<body>

    <div class="auth-wrapper">
        <div class="auth-header">
            <h2 th:text="${shopName}">Geetanjali Tailors</h2>
            <p>Staff &amp; Owner Login</p>
        </div>

        <!-- Flash messages for error / logout / registration notices -->
        <div th:replace="~{fragments/layout :: flash-messages}"></div>

        <div class="card">
            <!-- Form submits to POST /login which is intercepted by Spring Security -->
            <!-- th:action automatically includes the CSRF token input field -->
            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="text"
                           id="mobile"
                           name="mobile"
                           class="form-control"
                           placeholder="Enter 10-digit mobile number"
                           required
                           autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control"
                           placeholder="Enter your password"
                           required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                    Log In
                </button>
            </form>
        </div>
    </div>

</body>
</html>
