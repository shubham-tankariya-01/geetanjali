<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: page-head('Edit Garment Item')}"></th:block>
    <script th:src="@{/js/new-order.js}" defer></script>
</head>
<body>

    <header th:replace="~{fragments/layout :: top-bar}"></header>

    <main class="page-content">
        <div th:replace="~{fragments/layout :: flash-messages}"></div>

        <!-- Back to Order Navigation -->
        <div style="margin-bottom: var(--space-4);">
            <a th:href="@{'/orders/' + ${order.id}}" class="btn-back">&larr; Back to Order <span th:text="${@orderNumberFormatter.format(order)}">TS-2026-0001</span></a>
        </div>

        <section class="dashboard-hero-section">
            <h1 class="page-title">Editing Item in Order <span th:text="${@orderNumberFormatter.format(order)}">TS-2026-0001</span></h1>
            <div class="context-banner" style="margin-top: 10px;">
                <div class="context-meta-text">
                    <span class="text-secondary">Customer: </span>
                    <strong th:text="${order.customer.name}">Suresh Raina</strong>
                    (<span th:text="${order.customer.mobile}">9876512345</span>)
                    <span class="meta-dot">&bull;</span>
                    <span class="text-secondary">Garment: </span>
                    <strong th:text="${garment.name}">Shirt</strong>
                    <span class="meta-dot">&bull;</span>
                    <span class="text-secondary">Status: </span>
                    <span th:if="${item.isDelivered()}" class="status-pill delivered">DELIVERED</span>
                    <span th:if="${item.isDone() and !item.isDelivered()}" class="status-pill done">DONE / READY</span>
                    <span th:if="${item.isPending()}" class="status-pill pending">IN PROGRESS</span>
                </div>
            </div>
        </section>

        <!-- Embed Shared Item Form Fragment -->
        <div th:replace="~{fragments/item-form :: item-form(${formAction}, true)}"></div>
    </main>

</body>
</html>
