<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: page-head('New Order - Step 3: Item Details')}"></th:block>
    <script th:src="@{/js/new-order.js}" defer></script>
</head>
<body>

    <header th:replace="~{fragments/layout :: top-bar}"></header>

    <main class="page-content">
        <div th:replace="~{fragments/layout :: flash-messages}"></div>

        <nav th:replace="~{fragments/layout :: wizard-progress(3)}"></nav>

        <!-- Customer & Garment Context -->
        <section class="dashboard-hero-section">
            <h1 class="page-title">Step 3: Item Details &amp; Measurements</h1>
            <div class="context-banner" style="margin-top: 10px;">
                <div class="context-meta-text">
                    <span class="text-secondary">Customer: </span>
                    <strong th:text="${draft.customerName}">Ramesh Patel</strong>
                    (<span th:text="${draft.customerMobile}">9876543210</span>)
                    <span class="meta-dot">&bull;</span>
                    <span class="text-secondary">Garment: </span>
                    <strong th:text="${garment.name}">Shirt</strong>
                    <span th:if="${draft.itemCount > 0}">
                        <span class="meta-dot">&bull;</span>
                        <span class="badge badge-neutral" th:text="${draft.itemCount} + ' in cart'">1 in cart</span>
                    </span>
                </div>
            </div>
        </section>

        <!-- Shared Item Form Fragment -->
        <div th:replace="~{fragments/item-form :: item-form(${isEdit != null and isEdit ? '/orders/new/item/' + editIndex : '/orders/new/item'}, ${isEdit != null and isEdit})}"></div>
    </main>

</body>
</html>
